<!DOCTYPE html>
<html lang="pt-BR" data-auth="required" data-page="pipeline">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1210">
  <meta name="description" content="Pipeline comercial da AssinaSoft — acompanhe cada lead por etapa do funil.">
  <meta name="csrf-token" content="">
  <title>Pipeline · Portal Comercial</title>
  <link rel="icon" type="image/png" href="images/logoMini.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;650;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/crm.css">
  <script defer src="assets/js/config.js"></script>
  <script defer src="assets/js/util.js"></script>
  <script defer src="assets/js/store.js"></script>
  <script defer src="assets/js/auth.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Menu lateral"></aside>
    <div class="app__main">
      <header class="topbar" id="topbar"></header>
      <main class="page page--wide">
        <div class="page-head">
          <div class="page-head__main">
            <h1 class="page-head__title">Pipeline</h1>
            <p class="page-head__desc">Arraste os cards para avançar cada oportunidade. As etapas são configuráveis em Configurações.</p>
          </div>
          <div class="page-head__actions">
            <a class="btn btn--secondary" href="configuracoes.html#funil"><svg class="icon" aria-hidden="true"><use href="assets/vendor/lucide/sprite.svg#sliders-horizontal"></use></svg>Configurar funil</a>
            <button class="btn btn--primary" type="button" data-novo><svg class="icon" aria-hidden="true"><use href="assets/vendor/lucide/sprite.svg#plus"></use></svg>Novo lead</button>
          </div>
        </div>

        <div class="pipeline-toolbar">
          <div class="input-wrap pipeline-search">
            <svg class="icon" aria-hidden="true"><use href="assets/vendor/lucide/sprite.svg#search"></use></svg>
            <input class="input" id="pipeline-busca" type="search" placeholder="Buscar lead, empresa ou tag…" autocomplete="off">
          </div>
          <button class="btn btn--secondary btn--sm search-submit" type="button" data-buscar>
            <svg class="icon" aria-hidden="true"><use href="assets/vendor/lucide/sprite.svg#search"></use></svg>Pesquisar
          </button>
          <select class="select select--sm" id="pipeline-sistema" aria-label="Filtrar por sistema"><option value="">Todos os sistemas</option></select>
          <select class="select select--sm" id="pipeline-responsavel" aria-label="Filtrar por responsável"><option value="">Todos os responsáveis</option></select>
          <select class="select select--sm" id="pipeline-origem" aria-label="Filtrar por origem"><option value="">Todas as origens</option></select>
          <select class="select select--sm" id="pipeline-prioridade" aria-label="Filtrar por prioridade">
            <option value="">Todas as prioridades</option><option value="alta">Alta</option><option value="media">Média</option><option value="baixa">Baixa</option>
          </select>
          <button class="btn btn--ghost btn--sm" type="button" data-limpar><svg class="icon" aria-hidden="true"><use href="assets/vendor/lucide/sprite.svg#refresh-cw"></use></svg>Limpar</button>
          <div class="pipeline-toolbar__count"><strong id="pipeline-total">—</strong> lead(s) no funil</div>
        </div>

        <div class="pipeline-board" id="pipeline-board" aria-live="polite">
          <div class="board-loading"><span class="spinner"></span>Carregando funil…</div>
        </div>
        <p class="pipeline-hint"><svg class="icon" aria-hidden="true"><use href="assets/vendor/lucide/sprite.svg#info"></use></svg>Arraste os leads entre as colunas para atualizar a etapa. Clique em um card para ver o histórico completo.</p>
      </main>
    </div>
  </div>

  <script defer src="assets/js/icons.js"></script>
  <script defer src="assets/js/api.js"></script>
  <script defer src="assets/js/ui.js"></script>
  <script defer src="assets/js/components/lead-ui.js"></script>
  <script defer src="assets/js/pages/pipeline.js"></script>
</body>
</html>
