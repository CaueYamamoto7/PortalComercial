<!DOCTYPE html>
<html lang="pt-BR" data-auth="required" data-page="dashboard">
<head>
  <script src="assets/js/loading.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1210">
  <meta name="description" content="Painel de contatos da AssinaSoft — acompanhe quem precisa de resposta, quem está aguardando e quem não deve mais receber mensagens.">
  <meta name="csrf-token" content="">
  <title>Painel de contatos · AssinaSoft</title>
  <link rel="icon" type="image/png" href="images/logoMini.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;650;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/crm.css">
  <link rel="stylesheet" href="assets/css/modern.css">
  <link rel="stylesheet" href="assets/css/workspace.css">
  <script defer src="assets/js/config.js"></script>
  <script defer src="assets/js/util.js"></script>
  <script defer src="assets/js/store.js"></script>
  <script defer src="assets/js/auth.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Menu lateral"></aside>
    <div class="app__main">
      <header class="topbar" id="topbar"></header>
      <main class="page">
        <div class="page-head">
          <div class="page-head__main">
            <h1 class="page-head__title">Painel de contatos</h1>
            <p class="page-head__desc">Veja quem precisa de mensagem, quem respondeu e quem não deve mais ser contatado.</p>
            <p class="page-head__meta"><span class="badge badge--neutral" data-base-total>—</span></p>
          </div>
          <div class="page-head__actions">
            <a class="btn btn--secondary" href="leads.html?importar=1"><svg class="icon" aria-hidden="true"><use href="assets/vendor/lucide/sprite.svg#upload"></use></svg>Importar</a>
            <a class="btn btn--primary" href="leads.html?novo=1"><svg class="icon" aria-hidden="true"><use href="assets/vendor/lucide/sprite.svg#plus"></use></svg>Novo contato</a>
          </div>
        </div>

        <div class="dash-alert" id="dash-alerta" hidden>
          <svg class="icon" aria-hidden="true"><use href="assets/vendor/lucide/sprite.svg#triangle-alert"></use></svg>
          <span id="dash-alerta-texto"></span>
          <a href="followups.html" id="dash-alerta-link">Ver follow-ups</a>
        </div>

        <div class="dash-conv-grid" role="group" aria-label="Resumo das conversas">
          <button class="conv-card" type="button" data-conversa="sem_mensagem" title="Contatos ainda não abordados e fora da etapa Contatado">
            <span class="conv-card__head">
              <span class="conv-card__icon"><svg class="icon" aria-hidden="true"><use href="assets/vendor/lucide/sprite.svg#message-square"></use></svg></span>
              <span class="conv-card__label">Sem mensagem</span>
            </span>
            <span class="conv-card__value" data-conv="semMensagem">—</span>
          </button>

          <button class="conv-card" type="button" data-conversa="aguardando" title="Contato já abordado (pelo sistema ou manualmente) e ainda sem resposta">
            <span class="conv-card__head">
              <span class="conv-card__icon"><svg class="icon" aria-hidden="true"><use href="assets/vendor/lucide/sprite.svg#clock"></use></svg></span>
              <span class="conv-card__label">Aguardando</span>
            </span>
            <span class="conv-card__value" data-conv="aguardando">—</span>
          </button>

          <button class="conv-card conv-card--focus" type="button" data-conversa="responder" title="Contatos que responderam e aguardam sua próxima mensagem">
            <span class="conv-card__head">
              <span class="conv-card__icon"><svg class="icon" aria-hidden="true"><use href="assets/vendor/lucide/sprite.svg#message-circle"></use></svg></span>
              <span class="conv-card__label">Responder</span>
            </span>
            <span class="conv-card__value" data-conv="precisoResponder">—</span>
          </button>

          <button class="conv-card" type="button" data-conversa="abertas" title="Contatos que já responderam ou estão na etapa Proposta, exceto os marcados como não contatar">
            <span class="conv-card__head">
              <span class="conv-card__icon"><svg class="icon" aria-hidden="true"><use href="assets/vendor/lucide/sprite.svg#activity"></use></svg></span>
              <span class="conv-card__label">Em conversa</span>
            </span>
            <span class="conv-card__value" data-conv="conversasAbertas">—</span>
          </button>

          <button class="conv-card" type="button" data-conversa="clientes" title="Contatos que fecharam negócio">
            <span class="conv-card__head">
              <span class="conv-card__icon"><svg class="icon" aria-hidden="true"><use href="assets/vendor/lucide/sprite.svg#circle-check"></use></svg></span>
              <span class="conv-card__label">Clientes</span>
            </span>
            <span class="conv-card__value" data-conv="clientes">—</span>
          </button>

          <button class="conv-card" type="button" data-conversa="recusados" title="Recusaram ou pediram para não receber mensagens">
            <span class="conv-card__head">
              <span class="conv-card__icon"><svg class="icon" aria-hidden="true"><use href="assets/vendor/lucide/sprite.svg#ban"></use></svg></span>
              <span class="conv-card__label">Não contatar</span>
            </span>
            <span class="conv-card__value" data-conv="recusados">—</span>
          </button>
        </div>

        <div class="dash-row">
          <section class="card">
            <div class="card__head card__head--bordered">
              <div>
                <h2 class="card__title">Ações de hoje</h2>
                <p class="card__desc">Follow-ups que precisam da sua atenção</p>
              </div>
              <div class="card__actions">
                <a class="btn btn--secondary btn--sm" href="followups.html">Ver agenda</a>
              </div>
            </div>
            <div class="task-list" id="lista-tarefas">
              <div class="task-loading"><span class="skeleton" style="height:12px;width:60%"></span></div>
            </div>
            <div class="card__foot">
              <span class="small faint" id="tarefas-total">Carregando…</span>
              <button class="text-link" type="button" data-nova-tarefa>Agendar follow-up</button>
            </div>
          </section>

          <div class="dash-side">
            <section class="card">
              <div class="card__head">
                <div>
                  <h2 class="card__title">Mensagens recentes</h2>
                  <p class="card__desc">Últimos envios registrados</p>
                </div>
                <a class="icon-btn icon-btn--sm" href="mensagens.html?tab=historico" title="Ver histórico"><svg class="icon" aria-hidden="true"><use href="assets/vendor/lucide/sprite.svg#arrow-up-right"></use></svg></a>
              </div>
              <div class="card__body">
                <div class="campaign-mini" id="lista-campanhas"></div>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script defer src="assets/js/icons.js"></script>
  <script defer src="assets/js/api.js"></script>
  <script defer src="assets/js/ui.js"></script>
  <script defer src="assets/js/components/lead-ui.js"></script>
  <script defer src="assets/js/pages/dashboard.js"></script>
</body>
</html>
