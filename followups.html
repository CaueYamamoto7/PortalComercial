<!DOCTYPE html>
<html lang="pt-BR" data-auth="required" data-page="followups">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1210">
  <meta name="description" content="Agenda de follow-ups da AssinaSoft — não deixe nenhuma oportunidade esfriar.">
  <meta name="csrf-token" content="">
  <title>Follow-ups · Painel Comercial</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B6B57'/%3E%3Cpath d='M9 23 16 8l7 15M12 17h8' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;650;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/crm.css">
  <script src="assets/js/config.js"></script>
  <script src="assets/js/util.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/auth.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Menu lateral"></aside>
    <div class="app__main">
      <header class="topbar" id="topbar"></header>
      <main class="page">
        <div class="page-head">
          <div class="page-head__main">
            <div class="page-head__eyebrow">Comercial · Agenda</div>
            <h1 class="page-head__title">Follow-ups</h1>
            <p class="page-head__desc">Organize os próximos contatos e mantenha cada oportunidade em movimento.</p>
          </div>
          <div class="page-head__actions">
            <button class="btn btn--primary" type="button" data-novo><svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>Novo follow-up</button>
          </div>
        </div>

        <div class="followup-stats">
          <div class="followup-stat is-danger"><span>Atrasados</span><strong data-fstat="atrasadas">—</strong><small>retomar contato</small></div>
          <div class="followup-stat is-brand"><span>Hoje</span><strong data-fstat="hoje">—</strong><small>na agenda de hoje</small></div>
          <div class="followup-stat"><span>Próximos 7 dias</span><strong data-fstat="semana">—</strong><small>planejamento</small></div>
          <div class="followup-stat is-success"><span>Concluídos</span><strong data-fstat="concluidas">—</strong><small>histórico</small></div>
        </div>

        <section class="card followup-card">
          <div class="followup-toolbar">
            <div class="segmented" role="group" aria-label="Filtrar follow-ups">
              <button type="button" class="is-active" data-tab="pendentes">Pendentes</button>
              <button type="button" data-tab="atrasadas">Atrasados</button>
              <button type="button" data-tab="hoje">Hoje</button>
              <button type="button" data-tab="semana">Próximos 7 dias</button>
              <button type="button" data-tab="concluidas">Concluídos</button>
            </div>
            <div class="followup-toolbar__right">
              <div class="input-wrap followup-search">
                <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
                <input class="input" id="followup-busca" type="search" placeholder="Buscar tarefa ou lead…" autocomplete="off">
              </div>
              <select class="select select--sm" id="followup-responsavel" aria-label="Filtrar por responsável"><option value="">Todos os responsáveis</option></select>
            </div>
          </div>

          <div class="followup-list" id="followup-list">
            <div class="followup-loading"><span class="spinner"></span>Carregando agenda…</div>
          </div>
          <div class="card__foot">
            <span class="small faint" id="followup-count">—</span>
            <span class="small faint">Clique no título para abrir o lead</span>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/mock/data.js"></script>
  <script src="assets/js/mock/api.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/components/lead-ui.js"></script>
  <script src="assets/js/pages/followups.js"></script>
</body>
</html>
